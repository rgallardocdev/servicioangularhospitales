<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0">Modificar Hospital</h5>
        </div>
        <div class="card-body">
            <form #hospitalForm="ngForm">
                
                <!-- Campo oculto o solo lectura para idHospital -->
                <input type="hidden" name="idHospital" [(ngModel)]="this._idHospital">

                <div class="row g-3">
                    <!-- ID Hospital (Visible solo como referencia, deshabilitado) -->
                    <div class="col-md-3">
                        <label for="idHospital" class="form-label">ID Hospital</label>
                        <input type="number" class="form-control" id="idHospital" 
                               [value]="_idHospital" disabled readonly>
                    </div>

                    <!-- Nombre -->
                    <div class="col-md-9">
                        <label for="cajanombre" class="form-label">Nombre del Hospital</label>
                        <input type="text" class="form-control" id="cajanombre" name="cajanombre" #cajanombre>
                    </div>

                    <!-- Dirección -->
                    <div class="col-12">
                        <label for="cajadireccion" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="cajadireccion" name="cajadireccion" #cajadireccion>
                    </div>

                    <!-- Teléfono -->
                    <div class="col-md-6">
                        <label for="cajatelefono" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="cajatelefono" name="cajatelefono" #cajatelefono>
                    </div>

                    <!-- Camas -->
                    <div class="col-md-6">
                        <label for="cajacamas" class="form-label">Número de Camas</label>
                        <input type="number" class="form-control" id="cajacamas" name="cajacamas" #cajacamas>
                    </div>
                </div>

                <!-- Botones -->
                <div class="mt-4 d-flex justify-content-end gap-2">
                    <!-- <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button> -->
                    <button (click)="modificarRoutingHospital()" class="btn btn-warning">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
