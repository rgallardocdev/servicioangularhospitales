<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0">Modificar Hospital</h5>
        </div>
        <div class="card-body">
            <form #hospitalForm="ngForm" (ngSubmit)="modificarHospital()">
                
                <!-- Campo oculto o solo lectura para idHospital -->
                <input type="hidden" name="idHospital" [(ngModel)]="_hospital.idHospital">

                <div class="row g-3">
                    <!-- ID Hospital (Visible solo como referencia, deshabilitado) -->
                    <div class="col-md-3">
                        <label for="idHospital" class="form-label">ID Hospital</label>
                        <input type="number" class="form-control" id="idHospital" 
                               [value]="hospital.idHospital" disabled readonly>
                    </div>

                    <!-- Nombre -->
                    <div class="col-md-9">
                        <label for="nombre" class="form-label">Nombre del Hospital</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" 
                               [(ngModel)]="hospital.nombre" required>
                    </div>

                    <!-- Dirección -->
                    <div class="col-12">
                        <label for="direccion" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="direccion" name="direccion" 
                               [(ngModel)]="hospital.direccion" required>
                    </div>

                    <!-- Teléfono -->
                    <div class="col-md-6">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" 
                               [(ngModel)]="hospital.telefono" required>
                    </div>

                    <!-- Camas -->
                    <div class="col-md-6">
                        <label for="camas" class="form-label">Número de Camas</label>
                        <input type="number" class="form-control" id="camas" name="camas" 
                               [(ngModel)]="hospital.camas" min="0" required>
                    </div>
                </div>

                <!-- Botones -->
                <div class="mt-4 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
                    <button type="submit" class="btn btn-warning" [disabled]="hospitalForm.invalid">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
